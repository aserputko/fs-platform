services:
  identity-db:
    image: postgres:18-alpine
    container_name: fs-identity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity_db
      # Pinning PGDATA to a subdirectory keeps the named volume valid across image major versions.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U identity -d identity_db']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  be-identity-service:
    build:
      context: .
      dockerfile: apps/be-identity-service/Dockerfile
    container_name: fs-be-identity-service
    restart: unless-stopped
    profiles: ['full']
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://identity:identity@identity-db:5432/identity_db?schema=public
      JWT_ISSUER: http://localhost:3001
      JWT_AUDIENCE: fs-platform
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:-}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:-}
    ports:
      - '3001:3001'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Observability stack. Opt in with `docker compose --profile observability up -d`.
  loki:
    image: grafana/loki:3.7.6
    container_name: fs-loki
    restart: unless-stopped
    profiles: ['observability']
    command: ['-config.file=/etc/loki/loki-config.yaml']
    ports:
      - '3100:3100'
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: fs-alloy
    restart: unless-stopped
    profiles: ['observability']
    # Reading the Docker socket needs root; this container is local-only.
    user: root
    depends_on:
      - loki
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    ports:
      - '12345:12345'
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/var/log/fs-platform:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    image: grafana/grafana:13.0.6
    container_name: fs-grafana
    restart: unless-stopped
    profiles: ['observability']
    depends_on:
      - loki
    environment:
      # Local-only convenience: no login prompt in front of the dashboards.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - '3000:3000'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  identity-db-data:
  loki-data:
  alloy-data:
  grafana-data:
