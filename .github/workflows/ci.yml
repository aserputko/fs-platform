name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # prisma.config.ts resolves DATABASE_URL eagerly, so even `prisma generate` needs it set.
  DATABASE_URL: postgresql://identity:identity@localhost:5432/identity_db?schema=public

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity
          POSTGRES_DB: identity_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity -d identity_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Apply migrations
        run: npm run db:migrate:deploy --workspace @fs-platform/be-identity-service

      # The e2e setup mints a throwaway RS256 key pair, so no signing secrets are needed here.
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/be-identity-service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
